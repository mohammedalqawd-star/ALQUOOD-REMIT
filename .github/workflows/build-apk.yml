name: Build ALQUOOD REMIT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: mobile
        run: flutter create --platforms=android --project-name alquood_remit .
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Build universal APK
        working-directory: mobile
        run: flutter build apk --release
      - name: Preserve universal APK
        run: |
          mkdir -p dist
          cp mobile/build/app/outputs/flutter-apk/app-release.apk dist/ALQUOOD-REMIT-universal.apk
      - name: Build APKs for individual architectures
        working-directory: mobile
        run: flutter build apk --release --split-per-abi
      - name: Collect all APKs
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/ALQUOOD-REMIT-armeabi-v7a.apk
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/ALQUOOD-REMIT-arm64-v8a.apk
          cp mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk dist/ALQUOOD-REMIT-x86_64.apk
          ls -lh dist/
      - name: Upload installable APK files
        uses: actions/upload-artifact@v4
        with:
          name: ALQUOOD-REMIT-Android-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90
